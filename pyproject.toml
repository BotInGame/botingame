[project]
name = "botingame"
version = "0.1.0.dev3"
description = "BotInGame: the Game rules, the Bot SDK and the botingame CLI"
readme = "README.md"
license = "GPL-3.0-or-later AND 0BSD"
license-files = ["LICENSE", "NOTICE", "examples/LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "questionary>=2.1.1",
    "rich>=15.0.0",
    "typer>=0.29.1",
]

[project.urls]
Homepage = "https://botingame.com"
Repository = "https://github.com/BotInGame/botingame"
Issues = "https://github.com/BotInGame/botingame/issues"

[project.scripts]
botingame = "botingame.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8",
    "jsonschema>=4",
    "ruff>=0.17.3",
    "pytest-xdist>=3.8.0",
]

[tool.hatch.build.targets.sdist]
include = ["botingame", "tests", "README.md", "LICENSE", "NOTICE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# -n auto: tests run on one worker per CPU (pytest-xdist); -n 0 runs them in one process.
addopts = ["--import-mode=importlib", "-n", "auto"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Pyflakes + pycodestyle errors.
select = ["E", "F"]
ignore = ["E741"]
